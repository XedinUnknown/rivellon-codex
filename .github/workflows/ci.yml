name: CI

on:
  push:
    branches: [master, '*.*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test

  build-e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make build
      - run: npx playwright test
      - name: Upload the single-file build (claude.ai artifact / double-click)
        uses: actions/upload-artifact@v7
        with:
          name: rivellon-codex-single
          path: dist/single/index.html
      - name: Upload the static-site build
        uses: actions/upload-artifact@v7
        with:
          name: rivellon-codex-web
          path: dist/web/
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
